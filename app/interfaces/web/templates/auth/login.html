<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link rel="stylesheet" href="/static/css/tailwind.css?v=20260714-2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-full bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <main class="min-h-full flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="text-center">
                <img src="/static/img/logo.png" alt="{{ APP_NAME }}" class="mx-auto h-24 w-auto">
                <h1 class="mt-6 text-3xl font-extrabold text-white">{{ APP_NAME }}</h1>
                <p class="mt-2 text-sm text-gray-400">Sistema de Gestión</p>
            </div>

            <section class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-8">
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            <i class="fas fa-user mr-2 text-primary-500"></i>Usuario
                        </label>
                        <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="64"
                               class="appearance-none relative block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg placeholder-gray-400 dark:placeholder-gray-500 text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                               placeholder="Ej: juanito123">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            <i class="fas fa-lock mr-2 text-primary-500"></i>Contraseña
                        </label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"
                                   class="appearance-none relative block w-full px-4 py-3 pr-12 border border-gray-300 dark:border-gray-600 rounded-lg placeholder-gray-400 dark:placeholder-gray-500 text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                   placeholder="••••••••">
                            <button type="button" id="toggle-password" aria-label="Mostrar u ocultar contraseña" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="mt-2 text-right">
                            <button type="button" id="forgot-password" class="text-sm font-medium text-primary-600 hover:text-primary-500">¿Olvidaste tu contraseña?</button>
                        </div>
                    </div>
                    <button type="submit" id="login-submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all shadow-lg hover:shadow-xl disabled:opacity-60">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3"><i id="login-icon" class="fas fa-sign-in-alt"></i></span>
                        <span id="login-label">Iniciar sesión</span>
                    </button>
                    <p id="login-status" class="hidden text-center text-sm text-gray-500" role="status" aria-live="polite"></p>
                </form>

                <div class="mt-6 pt-5 border-t border-gray-200 dark:border-gray-700 text-center">
                    <p class="text-sm text-gray-600 dark:text-gray-400">¿Eres profesor, padre, madre o tutor?</p>
                    <a href="/registro" class="mt-1 inline-block font-medium text-primary-600 hover:text-primary-500">Completa tu registro con el código</a>
                </div>
            </section>

            <footer class="text-center text-xs text-gray-500">
                © {{ current_year }} {{ APP_NAME }}. Todos los derechos reservados.<br>
                <span class="text-gray-600">Ambiente: {{ ENV }}</span>
            </footer>
        </div>
    </main>
    <script>
        const toggleButton = document.getElementById('toggle-password');
        toggleButton.addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon = toggleButton.querySelector('i');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        document.getElementById('forgot-password').addEventListener('click', () => Swal.fire({
            icon: 'info',
            title: 'Recuperación de contraseña',
            text: 'Contacta con el administrador de tu sede. Te entregará una contraseña temporal y el sistema te pedirá cambiarla al iniciar sesión.',
            confirmButtonText: 'Entendido',
            confirmButtonColor: '#DD8E0A'
        }));

        function destinoDespuesDelLogin(usuario) {
            if (usuario?.debe_cambiar_password) return '/cambiar-contrasena';
            const roles = (usuario?.roles || []).map(rol => String(rol?.nombre || rol).toUpperCase());
            if (roles.some(rol => ['PROFESORA', 'DOCENTE', 'TUTOR'].includes(rol))) return '/academico';
            return '/dashboard';
        }

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('login-submit');
            const label = document.getElementById('login-label');
            const icon = document.getElementById('login-icon');
            const status = document.getElementById('login-status');
            button.disabled = true;
            label.textContent = 'Verificando...';
            icon.className = 'fas fa-circle-notch fa-spin';
            status.textContent = 'Preparando tu acceso...';
            status.classList.remove('hidden');
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || data.message || 'Credenciales inválidas');
                window.location.replace(destinoDespuesDelLogin(data.usuario));
            } catch (error) {
                await Swal.fire({ icon: 'error', title: 'No se pudo iniciar sesión', text: error.message });
                button.disabled = false;
                label.textContent = 'Iniciar sesión';
                icon.className = 'fas fa-sign-in-alt';
                status.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
