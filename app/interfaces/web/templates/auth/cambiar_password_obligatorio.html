<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link rel="stylesheet" href="/static/css/tailwind.css?v=20260714">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-full bg-gradient-to-br from-gray-950 via-gray-900 to-slate-900">
    <main class="min-h-full flex items-center justify-center p-4">
        <section class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-7 sm:p-9">
            <div class="text-center">
                <img src="/static/img/logo.png" alt="Datilera" class="h-16 w-auto mx-auto">
                <div class="mx-auto mt-5 w-12 h-12 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center"><i class="fas fa-key"></i></div>
                <h1 class="mt-4 text-2xl font-bold">Crea una nueva contraseña</h1>
                <p class="mt-2 text-sm text-gray-600">Por seguridad, la contraseña temporal solo sirve para este primer acceso.</p>
            </div>
            <form id="forced-password-form" class="mt-7 space-y-4">
                <div>
                    <label for="password-actual" class="block text-sm font-semibold mb-1">Contraseña temporal</label>
                    <input id="password-actual" type="password" autocomplete="current-password" required minlength="8" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label for="password-nueva" class="block text-sm font-semibold mb-1">Nueva contraseña</label>
                    <input id="password-nueva" type="password" autocomplete="new-password" required minlength="12" maxlength="128" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none">
                    <p class="mt-1 text-xs text-gray-500">Mínimo 12 caracteres. No reutilices la contraseña temporal.</p>
                </div>
                <div>
                    <label for="password-confirmacion" class="block text-sm font-semibold mb-1">Confirmar nueva contraseña</label>
                    <input id="password-confirmacion" type="password" autocomplete="new-password" required minlength="12" maxlength="128" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button id="forced-password-submit" type="submit" class="w-full rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 disabled:opacity-60">
                    Guardar y continuar
                </button>
            </form>
            <p class="mt-6 text-center text-xs text-gray-400">© {{ current_year }} Datilera</p>
        </section>
    </main>
    <script>
        document.getElementById('forced-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const actual = document.getElementById('password-actual').value;
            const nueva = document.getElementById('password-nueva').value;
            const confirmacion = document.getElementById('password-confirmacion').value;
            if (nueva !== confirmacion) {
                return Swal.fire({ icon: 'error', title: 'Revisa las contraseñas', text: 'Las contraseñas nuevas no coinciden.' });
            }
            const button = document.getElementById('forced-password-submit');
            button.disabled = true;
            try {
                const response = await fetch('/api/v1/auth/cambiar-password-obligatorio', {
                    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password_actual: actual, password_nueva: nueva, password_confirmacion: confirmacion })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'No se pudo actualizar la contraseña');
                await Swal.fire({ icon: 'success', title: 'Contraseña actualizada', text: 'Ya puedes continuar al sistema.', timer: 1600 });
                window.location.replace('/login');
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'No se pudo guardar', text: error.message });
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
