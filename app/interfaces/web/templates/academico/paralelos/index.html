{% extends "base.html" %}
{% block content %}
<div class="mb-8 flex justify-between items-center">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Paralelos</h1>
    <div class="flex gap-2">
        <a href="/inscripciones" class="text-gray-500 hover:text-gray-700 dark:hover:text-white px-4 py-2">Volver</a>
        <button onclick="nuevoParalelo()" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg shadow flex items-center">
            <i class="fas fa-plus mr-2"></i> Nuevo Paralelo
        </button>
    </div>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden">
    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
        <input type="search" id="search-paralelo" placeholder="Buscar paralelo o grupo..." class="border rounded px-4 py-2 w-full max-w-md dark:bg-gray-700 dark:text-white dark:border-gray-600">
    </div>
    <table class="w-full text-left">
        <thead class="bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-300 uppercase text-xs">
            <tr>
                <th class="px-6 py-3">Letra</th>
                <th class="px-6 py-3">Grupo Padre</th>
                <th class="px-6 py-3">Capacidad</th>
                <th class="px-6 py-3">Estado</th>
                <th class="px-6 py-3 text-right">Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-paralelos" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm dark:text-gray-300"></tbody>
    </table>
</div>

<div id="modal-paralelo" class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md mx-4">
        <form id="form-paralelo" class="p-6">
            <input type="hidden" name="id" id="paralelo-id">

            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white" id="modal-title">Nuevo Paralelo</h3>
                <button type="button" onclick="closeModal('modal-paralelo')" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 dark:text-gray-300">Grupo</label>
                    <select id="paralelo-grupo" name="grupo_id" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-indigo-500 outline-none">
                        </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 dark:text-gray-300">Letra</label>
                        <input type="text" name="letra" id="paralelo-letra" required placeholder="A, B..." class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 dark:text-gray-300">Capacidad</label>
                        <input type="number" name="capacidad" id="paralelo-capacidad" value="15" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none">
                    </div>
                </div>

                <div class="flex items-center pt-2">
                    <input type="checkbox" name="activo" id="paralelo-activo" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" checked>
                    <label for="paralelo-activo" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Activo</label>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button type="button" onclick="closeModal('modal-paralelo')" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 font-medium shadow-sm">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script type="module" src="/static/js/paralelos.js"></script>
{% endblock %}
