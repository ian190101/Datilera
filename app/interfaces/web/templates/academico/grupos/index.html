{% extends "base.html" %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Grupos</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Gestión de niveles y aulas</p>
    </div>
    <div class="flex gap-2">
        <a href="/inscripciones" class="text-gray-500 hover:text-gray-700 dark:hover:text-white px-4 py-2">Volver</a>
        <button onclick="nuevoGrupo()" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg shadow flex items-center">
            <i class="fas fa-plus mr-2"></i> Nuevo Grupo
        </button>
    </div>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden">
    <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex gap-4">
        <input type="search" id="search-grupo" placeholder="Buscar grupo..." class="border rounded px-4 py-2 w-full max-w-md dark:bg-gray-700 dark:text-white dark:border-gray-600">
    </div>
    <table class="w-full text-left">
        <thead class="bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-300 uppercase text-xs">
            <tr>
                <th class="px-6 py-3">Nombre</th>
                <th class="px-6 py-3">Gestión</th>
                <th class="px-6 py-3">Fecha Creación</th>
                <th class="px-6 py-3">Estado</th>
                <th class="px-6 py-3 text-right">Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-grupos" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm dark:text-gray-300"></tbody>
    </table>
</div>

<div id="modal-grupo" class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md mx-4">
        <form id="form-grupo" class="p-6">
            <input type="hidden" name="id" id="grupo-id"> 
            
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white" id="modal-title">Nuevo Grupo</h3>
                <button type="button" onclick="closeModal('modal-grupo')" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Nombre</label>
                    <input type="text" name="nombre" id="grupo-nombre" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Gestión</label>
                    <input type="number" name="gestion" id="grupo-gestion" value="2025" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" name="activo" id="grupo-activo" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" checked>
                    <label for="grupo-activo" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Activo</label>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-3">
                <button type="button" onclick="closeModal('modal-grupo')" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700 font-medium shadow-sm">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="/static/js/grupos.js"></script>
{% endblock %}
