{% extends "base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Categorías de Egreso</h1>
    <p class="text-gray-600 dark:text-gray-400">Activar / Desactivar (no se elimina).</p>
  </div>
   <a href="/finanzas" class="text-gray-500 hover:text-gray-700 dark:hover:text-white px-4 py-2">Volver</a>
  <button onclick="openModal('modal-cat-egreso')"
    class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow transition-colors flex items-center">
    <i class="fas fa-plus mr-2"></i> Nueva categoría
  </button>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-700">
  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm text-gray-500 dark:text-gray-400">
      <thead class="bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-300 uppercase text-xs">
        <tr>
          <th class="px-6 py-3">Nombre</th>
          <th class="px-6 py-3 text-center">Estado</th>
          <th class="px-6 py-3 text-center">Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-categorias-egresos" class="divide-y divide-gray-200 dark:divide-gray-700">
        <tr><td colspan="3" class="px-6 py-8 text-center text-gray-400">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="modal-cat-egreso" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        
        <div class="fixed inset-0 bg-gray-900 bg-opacity-50 transition-opacity backdrop-blur-sm" onclick="closeModal('modal-cat-egreso')"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full border border-gray-200 dark:border-gray-700">
            
            <form id="form-cat-egreso" class="p-6" onsubmit="submitCategoria(event,'egreso')">
                
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Nueva categoría de egreso</h3>
                    <button type="button" onclick="closeModal('modal-cat-egreso')" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre</label>
                    <input type="text" name="nombre" required placeholder="Ej: Mantenimiento, Publicidad" 
                        class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                </div>

                <div class="flex justify-between items-center pt-4 border-t border-gray-100 dark:border-gray-700">
                    <a href="/finanzas/categorias/egresos" class="text-sm text-primary-600 hover:text-primary-800 dark:text-primary-400 hover:underline">
                        Ver todas las categorías
                    </a>
                    
                    <div class="flex space-x-3">
                        <button type="button" onclick="closeModal('modal-cat-egreso')" 
                            class="bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" 
                            class="bg-primary-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-primary-700 shadow-md transition-colors">
                            Guardar
                        </button>
                    </div>
                </div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="/static/js/finanzas_categorias.js"></script>
{% endblock %}
