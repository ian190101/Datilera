{% extends "base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Planes de Pago</h1>
        <p class="text-gray-600 dark:text-gray-400">Generar planes y consultar por alumno.</p>
    </div>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
        
        <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase">Alumno</label>
            <select id="pp_alumno_id" class="mt-1 w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white transition-colors focus:ring-primary-500 focus:border-primary-500">
                </select>
        </div>

        <div class="flex gap-2">
            <button onclick="cargarPlanPagoAlumno()" class="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium shadow transition-colors">
                Consultar
            </button>
            
            <button onclick="openModal('modal-plan-pago')" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow transition-colors flex items-center gap-2 whitespace-nowrap">
                <i class="fas fa-plus"></i> Plan pago
            </button>
        </div>
    </div>
</div>

<div class="mt-4 bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-700">
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-500 dark:text-gray-400">
            <thead class="bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-300 uppercase text-xs">
                <tr>
                    <th class="px-6 py-3">Concepto</th>
                    <th class="px-6 py-3">Vencimiento</th>
                    <th class="px-6 py-3 text-right">Monto Total</th>
                    <th class="px-6 py-3 text-center">Estado</th>
                    <th class="px-6 py-3 text-right">Saldo Pendiente</th>
                </tr>
            </thead>
            <tbody id="tabla-pp-body" class="divide-y divide-gray-200 dark:divide-gray-700">
                </tbody>
        </table>
    </div>
</div>

<div id="modal-plan-pago" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        
        <div class="fixed inset-0 bg-gray-900 bg-opacity-50 transition-opacity backdrop-blur-sm" onclick="closeModal('modal-plan-pago')"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl w-full border border-gray-200 dark:border-gray-700">
            
            <form id="form-plan-pago" class="p-6" onsubmit="submitPlanPago(event)">
                
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Crear plan de pago</h3>
                    <button type="button" onclick="closeModal('modal-plan-pago')" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Alumno</label>
                        <select id="plan_alumno_id" name="alumnoid" required class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                            <option value="">Cargando...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Fecha de ingreso</label>
                        <input type="date" name="fecha_ingreso" required class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mensualidad (Bs.)</label>
                        <input type="number" step="0.01" name="mensualidad" required placeholder="0.00" class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Incluye material/merienda</label>
                        <select name="incluye_material" class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                            <option value="SI">SI</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Monto material (Bs.)</label>
                        <input type="number" step="0.01" name="monto_material" value="3400" class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo de Plan</label>
                        <select name="tipo_pago" required class="block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-2 px-3 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                            <option value="MENSUAL">MENSUAL</option>
                            <option value="SEMESTRAL">SEMESTRAL</option>
                            <option value="ANUAL">ANUAL</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-4 border-t border-gray-100 dark:border-gray-700">
                    <a href="/finanzas/planes-pago" class="text-sm text-primary-600 hover:text-primary-800 dark:text-primary-400 hover:underline">
                        Ver todos los planes
                    </a>
                    
                    <div class="flex space-x-3">
                        <button type="button" onclick="closeModal('modal-plan-pago')" class="bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="bg-primary-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-primary-700 shadow-md transition-colors">
                            Generar plan
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="/static/js/finanzas_planes_pago.js"></script>
{% endblock %}
