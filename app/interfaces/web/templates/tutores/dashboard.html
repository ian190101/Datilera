<!-- app/interfaces/web/templates/tutores/dashboard.html -->
{% extends "base.html" %}

{% block content %}

<!-- Header -->
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Mi Dashboard</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-400">Bienvenido, {{ current_user.nombre_completo }}</p>
</div>

<!-- Tarjetas de Mis Hijos -->
<div class="mb-8">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">
        <i class="fas fa-child text-primary-600 mr-2"></i>
        Mis Hijos
    </h2>
    <div id="hijos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cargando... -->
        <div class="col-span-full text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-primary-500 mb-3"></i>
            <p class="text-gray-600 dark:text-gray-400">Cargando información...</p>
        </div>
    </div>
</div>

<!-- Notificaciones Recientes -->
<div class="mb-8">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">
            <i class="fas fa-bell text-primary-600 mr-2"></i>
            Notificaciones Recientes
        </h2>
        <a href="/tutor/notificaciones" class="text-sm text-primary-600 hover:text-primary-700 dark:text-primary-400">
            Ver todas <i class="fas fa-arrow-right ml-1"></i>
        </a>
    </div>
    
    <div id="notificaciones-container" class="space-y-3">
        <!-- Se carga dinámicamente -->
    </div>
</div>

<!-- Reportes Recientes -->
<div class="mb-8">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">
            <i class="fas fa-clipboard-list text-primary-600 mr-2"></i>
            Últimos Reportes
        </h2>
    </div>
    
    <div id="reportes-container" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
        <!-- Se carga dinámicamente -->
    </div>
</div>

<!-- Estado de Cuenta -->
<div class="mb-8">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">
        <i class="fas fa-money-bill-wave text-primary-600 mr-2"></i>
        Estado de Cuenta
    </h2>
    
    <div id="estado-cuenta-container">
        <!-- Se carga dinámicamente -->
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script type="module" src="{{ url_for('static', path='js/tutor-dashboard.js') }}"></script>
{% endblock %}
