<!-- app/interfaces/web/templates/components/header.html -->
<header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center justify-between px-6 py-4">
        
        

        <button id="mobile-menu-button" 
                class="md:hidden fixed top-4 left-4 z-50 p-3 rounded-lg bg-gray-800/90 backdrop-blur-sm text-white hover:bg-gray-700 focus:outline-none transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="flex-1"></div>
        <!-- Right: Actions -->
        <div class="flex items-center space-x-4 ml-6">
            
            <!-- Theme Toggle -->
            <button id="theme-toggle" 
                    class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors">
                <i class="fas fa-moon dark:hidden text-xl"></i>
                <i class="fas fa-sun hidden dark:block text-xl"></i>
            </button>
            
            <!-- Notifications -->
            <div class="relative">
                <button id="notifications-btn" 
                        class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors relative">
                    <i class="fas fa-bell text-xl"></i>
                    <span id="notification-badge" 
                          class="absolute top-0 right-0 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center hidden">
                        0
                    </span>
                </button>
            </div>
            
            <!-- User Profile -->
            {% if current_user %}
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" 
                        class="flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <div class="w-10 h-10 rounded-full bg-primary-500 flex items-center justify-center text-white font-semibold">
                        {{ current_user.nombre_completo[0] }}
                    </div>
                    <div class="hidden md:block text-left">
                        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ current_user.nombre_completo }}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">{{ current_user.role }}</p>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-sm"></i>
                </button>
                
                <!-- Dropdown -->
                <div x-show="open" 
                     @click.away="open = false"
                     x-transition
                     class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-2 z-50">
                    <a href="/perfil" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fas fa-user mr-2"></i> Mi Perfil
                    </a>
                    <a href="/configuracion" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fas fa-cog mr-2"></i> Configuración
                    </a>
                    <hr class="my-2 border-gray-200 dark:border-gray-700">
                    <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
            {% endif %}
            
        </div>
    </div>
</header>

<!-- Alpine.js (para dropdowns) -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
